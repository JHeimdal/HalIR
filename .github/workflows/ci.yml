name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libgsl-dev \
            libcerf-dev \
            doxygen

      - name: Configure
        run: cmake -S . -B Build

      - name: Build
        run: cmake --build Build

      - name: Test
        run: ctest --test-dir Build --output-on-failure

      - name: Docs (warning gate)
        run: cmake --build Build --target docs
